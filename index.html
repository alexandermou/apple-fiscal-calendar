<title>Apple Fiscal Calendar</title>
<style>
  :root{
    --bg: #f5f5f7;
    --surface: #ffffff;
    --border: #e5e5e7;
    --border-soft: #ececee;
    --ink: #1d1d1f;
    --ink-dim: #6e6e73;
    --ink-faint: #86868b;
    --accent: #0071e3;
    --accent-soft: #e8f2fe;
    --today: #ff3b30;
    --holiday: #248a3d;
    --holiday-soft: #eaf7ed;
    --shutdown: var(--holiday);
    --shutdown-soft: var(--holiday-soft);
    --leap: #ff9500;
    --leap-soft: #fff2e2;
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    height: 100%;
    overscroll-behavior-y: contain;
  }

  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum" 1;
    font-variant-numeric: tabular-nums;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  button, select, .calrow, .todaybtn, .navbtn{
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  .wrap{
    max-width: 1080px;
    margin: 0 auto;
    padding: 18px 22px 24px;
  }

  header.top{
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-rows: auto auto;
    column-gap: 22px;
    align-items: center;
    margin-bottom: 10px;
  }

  h1{
    grid-column: 1;
    grid-row: 1;
    font-size: 23px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  .subtitle{
    grid-column: 1;
    grid-row: 2;
    color: var(--ink-dim);
    font-size: 12px;
    letter-spacing: -0.005em;
  }

  .controls-row{
    display:flex;
    justify-content: flex-end;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 0;
  }

  .top-actions{
    grid-column: 2;
    grid-row: 1 / 3;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
  }

  .seg{
    display:flex;
    gap: 2px;
    background: #e8e8ed;
    border-radius: 10px;
    padding: 3px;
  }
  .seg button{
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: -0.005em;
    color: var(--ink-dim);
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease, box-shadow .15s ease;
    font-family: inherit;
  }
  .seg button:hover{ color: var(--ink); }
  .seg button.active{
    background: #ffffff;
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 1px 3px rgba(0,0,0,.14);
  }
  .seg.modeswitch button.active{ color: var(--accent); }

  .navbar{
    display:flex;
    align-items:center;
    gap: 10px;
    margin: 10px 0 12px;
    flex-wrap: wrap;
  }

  .navbtn{
    width: 34px; height: 34px;
    display:flex; align-items:center; justify-content:center;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 50%;
    cursor: pointer;
    font-size: 17px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
    transition: background .12s ease, transform .1s ease;
  }
  .navbtn:hover{ background: var(--bg); }
  .navbtn:active{ transform: scale(0.94); }
  .navbtn:disabled{ opacity: .3; cursor: default; }
  .navbtn:disabled:hover{ background: var(--surface); }

  .period-label{
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
    min-width: 200px;
  }
  .period-sub{
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-top: 2px;
  }

  .badge{
    display:inline-block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 3px 10px;
    border-radius: 999px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .badge.leap{ background: var(--leap-soft); color: var(--leap); }
  .badge.today{ background: var(--accent-soft); color: var(--accent); }

  .spacer{ flex: 1; }

  select#yearSelect{
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 13px;
    font-family: inherit;
    padding: 6px 12px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }

  .todaybtn{
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    padding: 6px 13px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .todaybtn:hover{ background: var(--bg); }

  .holiday-legend{
    display:flex;
    justify-content:flex-end;
    gap:14px;
    margin-left:auto;
    color:var(--ink-dim);
    font-size:11px;
    white-space:nowrap;
  }
  .holiday-legend span{ display:inline-flex; align-items:center; gap:6px; }
  .holiday-legend i{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .holiday-legend .holiday-key{ background:var(--holiday); }

  @media (max-width: 760px){
    .wrap{ padding-top: 14px; }
    header.top{ display:block; }
    .top-actions{ margin-top:10px; }
    .controls-row{ justify-content:flex-start; }
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 6px 20px rgba(0,0,0,.03);
  }

  /* Year view */
  .year-summary{
    display:flex;
    align-items:center;
    gap:16px;
    font-size: 13.5px;
    color: var(--ink-dim);
    margin-bottom: 18px;
    padding: 14px 18px;
  }
  .year-summary b{ color: var(--ink); font-weight: 600; }
  @media (max-width: 560px){
    .year-summary{ align-items:flex-start; }
    .year-summary .holiday-legend{ margin-top:2px; }
  }

  .qgrid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  @media (max-width: 640px){ .qgrid{ grid-template-columns: 1fr; } }

  .qcard{ padding: 16px 18px 18px; }
  .qcard.current{ border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  .qcard-head{
    display:flex; justify-content: space-between; align-items:baseline;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-soft);
  }
  .qcard-head .qname{ font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  .qcard-head .qrange{ font-size: 12px; color: var(--ink-dim); }

  .minigrid-wrap{ margin-top: 10px; }
  .minigrid-head{
    display:flex; justify-content: space-between;
    font-size: 11.5px;
    color: var(--ink-dim);
    margin-bottom: 5px;
    padding: 0 2px;
  }
  .minigrid-head .cur{ color: var(--accent); font-weight: 600; }

  /* Quarter view */
  .monthcard{ padding: 16px 18px 18px; margin-bottom: 14px; }
  .monthcard-head{
    display:flex; justify-content: space-between; align-items:baseline;
    margin-bottom: 12px;
  }
  .monthcard-head .mtitle{ font-weight:700; font-size:15px; letter-spacing: -0.01em; }
  .monthcard-head .msub{ color:var(--ink-faint); font-weight:400; font-size: 12.5px; }
  .monthcard-head .mrange{ font-size:12px; color:var(--ink-dim); }

  /* Day grids — Calendar-app style */
  table.calgrid{
    width: 100%;
    border-collapse: separate;
    border-spacing: 3px;
    table-layout: fixed;
  }
  table.calgrid th{
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align: center;
    padding: 0 0 6px;
  }
  table.calgrid tr.calrow{ cursor: pointer; }
  table.calgrid tr.calrow.current-row td.daycell{ background: var(--accent-soft); }
  table.calgrid tr.calrow.extra-row td.daycell{ box-shadow: inset 0 0 0 1.5px var(--leap); }
  table.calgrid tr.calrow:hover td.daycell{ background: #eef0f3; }
  table.calgrid tr.calrow.current-row:hover td.daycell{ background: #d9ecfd; }

  td.daycell{
    text-align: center;
    vertical-align: middle;
    padding: 8px 2px;
    font-size: 13px;
    color: var(--ink);
    background: var(--bg);
    border-radius: 8px;
  }
  td.daycell.outside{ opacity: .32; }
  td.daycell .monthtag{
    display: block;
    font-size: 8.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    margin-bottom: 2px;
  }
  td.daycell .num{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    border-radius: 50%;
  }
  td.daycell.today .num{ background: var(--today); color: #fff; font-weight: 700; }
  td.daycell.holiday{ background: var(--holiday-soft); color: var(--holiday); font-weight: 700; }
  td.daycell.shutdown{ background: var(--shutdown-soft); color: var(--shutdown); font-weight: 700; }
  td.daycell.holiday .num{ box-shadow: inset 0 -2px 0 var(--holiday); }
  td.daycell.shutdown .num{ box-shadow: inset 0 -2px 0 var(--shutdown); }
  td.daycell.today .num{ box-shadow:none; }

  table.calgrid.mini{ border-spacing: 1.5px; }
  table.calgrid.mini th{ font-size: 8px; padding: 0 0 3px; }
  table.calgrid.mini td.daycell{ font-size: 9.5px; padding: 3px 1px; border-radius: 5px; }
  table.calgrid.mini td.daycell .monthtag{ font-size: 6px; margin-bottom: 0; }
  table.calgrid.mini td.daycell .num{ width: 15px; height: 15px; }

  table.weektable{
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 20px;
  }
  table.weektable th{
    text-align: left;
    color: var(--ink-faint);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  table.weektable td{
    padding: 11px 12px;
    border-bottom: 1px solid var(--border-soft);
    color: var(--ink-dim);
    cursor: pointer;
  }
  table.weektable tr:hover td{ background: var(--bg); }
  table.weektable tr.current td{ color: var(--accent); background: var(--accent-soft); }
  table.weektable td.range{ color: var(--ink); font-weight: 500; }

  .infoline{
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: 16px;
  }
  .infoline b{ color: var(--ink); font-weight: 600; }

  /* Week view */
  .weekcard{ padding: 26px 26px 24px; }
  .weekcard .range{ font-size: 24px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 4px; }
  .weekcard .breadcrumb{ font-size: 12.5px; color: var(--ink-dim); margin-bottom: 20px; }
  .daystrip{ display:grid; grid-template-columns: repeat(7,1fr); gap: 8px; }
  .day{ background: var(--bg); border-radius: var(--radius-md); padding: 14px 6px; text-align:center; }
  .day.today{ background: var(--today); }
  .day .dname{

  .day.today .dname{ color: rgba(255,255,255,.75); }
  .day .dnum{ font-size: 16px; font-weight: 700; color: var(--ink); }
  .day.today .dnum{ color: #fff; }
  .day.holiday{ background: var(--holiday-soft); box-shadow: inset 0 0 0 1px #b9dfc2; }
  .day.shutdown{ background: var(--shutdown-soft); box-shadow: inset 0 0 0 1px #b9dfc2; }
  .day.holiday .dname, .day.holiday .dnum{ color: var(--holiday); }
  .day.shutdown .dname, .day.shutdown .dnum{ color: var(--shutdown); }
  .day.today .dname, .day.today .dnum{ color:#fff; }
  .day .holiday-name{ margin-top:8px; font-size:10px; line-height:1.25; font-weight:600; }

  footer.author{
    margin-top: 20px;
    padding: 12px 0 2px;
    border-top: 1px solid var(--border);

  footer.author a{
    color: var(--ink-dim);
    font-weight: 600;
    text-decoration: none;
  }
  footer.author a:hover{ text-decoration: underline; }

</style>

<body>
<div class="wrap">

      </div>

  </footer>

</div>

<script>
(function(){

  // ---------- date helpers (all UTC to avoid timezone/DST drift) ----------
  function startOfWeekUTC(date){
    const day = date.getUTCDay();
    const d = new Date(date.getTime());
    d.setUTCDate(d.getUTCDate() - day);
    return d;
  }
  function addDaysUTC(date, days){
    const d = new Date(date.getTime());
    d.setUTCDate(d.getUTCDate() + days);
    return d;
  }
  function fmt(d){ return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric', timeZone:'UTC' }); }
  function fmtShort(d){ return d.toLocaleDateString('en-US', { month:'short', day:'numeric', timeZone:'UTC' }); }
  function dayName(d){ return d.toLocaleDateString('en-US', { weekday:'short', timeZone:'UTC' }); }

  function sameUTCDate(a, b){
    return a.getUTCFullYear()===b.getUTCFullYear() && a.getUTCMonth()===b.getUTCMonth() && a.getUTCDate()===b.getUTCDate();
  }
  function nthWeekdayUTC(year, month, weekday, nth){
    const first = new Date(Date.UTC(year, month, 1));
    return new Date(Date.UTC(year, month, 1 + ((7 + weekday - first.getUTCDay()) % 7) + 7*(nth-1)));
  }
  function lastWeekdayUTC(year, month, weekday){
    const last = new Date(Date.UTC(year, month+1, 0));
    return new Date(Date.UTC(year, month, last.getUTCDate() - ((7 + last.getUTCDay() - weekday) % 7)));
  }
  function observedFixedHoliday(date, month, day, name, minYear){
    const year = date.getUTCFullYear();
    if (minYear && year < minYear) return null;
    const actual = new Date(Date.UTC(year, month, day));
    if (sameUTCDate(date, actual)) return { name, type:'holiday' };
    if (actual.getUTCDay()===6 && sameUTCDate(date, addDaysUTC(actual,-1))) return { name:name+' Holiday', type:'holiday' };
    if (actual.getUTCDay()===0 && sameUTCDate(date, addDaysUTC(actual,1))) return { name:name+' Holiday', type:'holiday' };
    return null;
  }
  function holidayInfo(date){
    const y=date.getUTCFullYear(), m=date.getUTCMonth(), d=date.getUTCDate(), dow=date.getUTCDay();
    if (m===11 && d===24) return {name:'Christmas Eve',type:'holiday'};
    if (m===11 && d===25) return {name:'Christmas',type:'holiday'};
    if (m===11 && d>=26 && d<=31 && dow!==0 && dow!==6) return {name:'Christmas Shutdown',type:'shutdown'};
    if (m===0 && d===1) return {name:"New Year's Day",type:'holiday'};
    if (m===0 && (d===2 || d===3) && dow===1) return {name:"New Year's Shutdown",type:'shutdown'};
    const juneteenth=observedFixedHoliday(date,5,19,'Juneteenth',2021);
    if (juneteenth) return juneteenth;
    const independence=observedFixedHoliday(date,6,4,'Independence Day');
    if (independence) return independence;
    if (sameUTCDate(date,nthWeekdayUTC(y,0,1,3))) return {name:'Martin Luther King Day',type:'holiday'};
    if (sameUTCDate(date,lastWeekdayUTC(y,4,1))) return {name:'Memorial Day',type:'holiday'};
    if (sameUTCDate(date,nthWeekdayUTC(y,8,1,1))) return {name:'Labor Day',type:'holiday'};
    const thanksgiving=nthWeekdayUTC(y,10,4,4);
    if (sameUTCDate(date,thanksgiving)) return {name:'Thanksgiving Day',type:'holiday'};
    if (sameUTCDate(date,addDaysUTC(thanksgiving,1))) return {name:'Thanksgiving Shutdown',type:'shutdown'};
    return null;
  }

  const MONTH_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const now = new Date();
  const todayUTC = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));

  function findIdxForDate(dsObj, d){
    const aw = dsObj.allWeeks;
    for (let i=0;i<aw.length;i++){ if (d >= aw[i].start && d <= aw[i].end) return i; }
    return d < aw[0].start ? 0 : aw.length - 1;
  }

  function buildGroups(allWeeks){
    const yearGroups=[], quarterGroups=[], monthGroups=[];
    let lastY=null, lastQ=null, lastM=null;
    allWeeks.forEach((w, idx) => {
      const qKey = w.yearKey+'-'+w.quarter, mKey = w.yearKey+'-'+w.month;
      if (w.yearKey !== lastY){ yearGroups.push({ yearKey:w.yearKey, startIdx: idx }); lastY = w.yearKey; }
      if (qKey !== lastQ){ quarterGroups.push({ yearKey:w.yearKey, quarter:w.quarter, startIdx: idx }); lastQ = qKey; }
      if (mKey !== lastM){ monthGroups.push({ yearKey:w.yearKey, month:w.month, quarter:w.quarter, startIdx: idx }); lastM = mKey; }
    });
    return { yearGroups, quarterGroups, monthGroups };
  }

  // ================= FISCAL DATASET =================
  function buildFiscalDataset(){
    const YEAR_MIN = 2000, YEAR_MAX = 2042;
    function fyStartDate(fy){ return startOfWeekUTC(new Date(Date.UTC(fy - 1, 9, 1))); }
    const starts = {};
    for (let fy = YEAR_MIN; fy <= YEAR_MAX + 1; fy++) starts[fy] = fyStartDate(fy);

    const monthWeeksRegular = [5,4,4, 5,4,4, 5,4,4, 5,4,4];
    const allWeeks = [];
    const yearMeta = {};

    for (let fy = YEAR_MIN; fy <= YEAR_MAX; fy++){
      const s = starts[fy], sNext = starts[fy+1];
      const totalDays = Math.round((sNext - s) / 86400000);
      const totalWeeks = totalDays / 7;
      const isLeap = totalWeeks === 53;
      const monthWeeks = monthWeeksRegular.slice();
      if (isLeap) monthWeeks[2] = 5;

      let cursor = s, weekOfYear = 0;
      const monthsMeta = [];
      for (let m = 0; m < 12; m++){
        const wCount = monthWeeks[m];
        const quarter = Math.floor(m/3) + 1;
        const monthOfQuarter = (m % 3) + 1;
        const monthStart = cursor;
        const weeksInMonth = [];
        for (let w = 0; w < wCount; w++){
          weekOfYear++;
          const wStart = cursor, wEnd = addDaysUTC(cursor, 6);
          const weekObj = {
            yearKey: fy, quarter, month: m+1, monthOfQuarter,
            weekOfMonth: w+1, weekOfMonthTotal: wCount,
            weekOfYear, weekOfYearTotal: totalWeeks,
            weekOfQuarter: null, weekOfQuarterTotal: null,
            isExtraWeek: (isLeap && m === 2 && w === wCount - 1),
            start: wStart, end: wEnd
          };
          weeksInMonth.push(weekObj);
          allWeeks.push(weekObj);
          cursor = addDaysUTC(cursor, 7);
        }
        const monthEnd = addDaysUTC(cursor, -1);
        monthsMeta.push({ month:m+1, quarter, monthOfQuarter, start:monthStart, end:monthEnd, weeks:weeksInMonth, weekCount:wCount, name:'Month '+(m+1), abbr:'M'+(m+1) });
      }
      for (let q = 1; q <= 4; q++){
        const qWeeks = allWeeks.filter(w => w.yearKey === fy && w.quarter === q);
        qWeeks.forEach((w, i) => { w.weekOfQuarter = i+1; w.weekOfQuarterTotal = qWeeks.length; });
      }
      const quartersMeta = [1,2,3,4].map(q => {
        const ms = monthsMeta.filter(mm => mm.quarter === q);
        return { quarter:q, start: ms[0].start, end: ms[ms.length-1].end, weekCount: ms.reduce((a,mm)=>a+mm.weekCount,0), months: ms };
      });
      yearMeta[fy] = { yearKey: fy, start: s, end: addDaysUTC(sNext, -1), totalWeeks, totalDays, isLeap, months: monthsMeta, quarters: quartersMeta };
    }

    const groups = buildGroups(allWeeks);
    const currentIndex = findIdxForDate({ allWeeks }, todayUTC);
    return Object.assign({ YEAR_MIN, YEAR_MAX, allWeeks, yearMeta, currentIndex }, groups);
  }

  // ================= CALENDAR (GREGORIAN) DATASET =================
  function buildCalendarDataset(){
    const YEAR_MIN = 2000, YEAR_MAX = 2042;
    function yearStart(y){ return startOfWeekUTC(new Date(Date.UTC(y, 0, 1))); }
    const starts = {};
    for (let y = YEAR_MIN; y <= YEAR_MAX + 1; y++) starts[y] = yearStart(y);

    const allWeeks = [];
    const yearMeta = {};

    for (let y = YEAR_MIN; y <= YEAR_MAX; y++){
      const s = starts[y], sNext = starts[y+1];
      const totalWeeksContinuous = Math.round((sNext - s) / 604800000);
      const isLeap = (y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0));

      // continuous weeks: for Week-view nav + weekOfYear numbering
      let cursor = s;
      const yearWeeksTemp = [];
      for (let i = 0; i < totalWeeksContinuous; i++){
        const wStart = cursor, wEnd = addDaysUTC(cursor, 6);
        const m = wStart.getUTCMonth() + 1;
        const q = Math.floor((m-1)/3) + 1;
        const weekObj = {
          yearKey: y, quarter: q, month: m, monthOfQuarter: ((m-1)%3)+1,
          weekOfYear: i+1, weekOfYearTotal: totalWeeksContinuous,
          weekOfMonth: null, weekOfMonthTotal: null,
          weekOfQuarter: null, weekOfQuarterTotal: null,
          isExtraWeek: false, start: wStart, end: wEnd
        };
        yearWeeksTemp.push(weekObj);
        allWeeks.push(weekObj);
        cursor = addDaysUTC(cursor, 7);
      }
      for (let mm=1; mm<=12; mm++){
        const mw = yearWeeksTemp.filter(w => w.month===mm);
        mw.forEach((w,i) => { w.weekOfMonth = i+1; w.weekOfMonthTotal = mw.length; });
      }
      for (let q=1; q<=4; q++){
        const qw = yearWeeksTemp.filter(w => w.quarter===q);
        qw.forEach((w,i) => { w.weekOfQuarter = i+1; w.weekOfQuarterTotal = qw.length; });
      }

      // display grids: real calendar months, with leading/trailing padding days
      const monthsMeta = [];
      for (let mm=1; mm<=12; mm++){
        const monthStart = new Date(Date.UTC(y, mm-1, 1));
        const monthEnd = new Date(Date.UTC(y, mm, 0));
        const gridStart = startOfWeekUTC(monthStart);
        const gridEndWeekStart = startOfWeekUTC(monthEnd);
        const weeks = [];
        let c = gridStart;
        while (c.getTime() <= gridEndWeekStart.getTime()){
          weeks.push({ start:c, end: addDaysUTC(c,6), isExtraWeek:false });
          c = addDaysUTC(c, 7);
        }
        const quarter = Math.floor((mm-1)/3) + 1;
        monthsMeta.push({
          month: mm, quarter, monthOfQuarter: ((mm-1)%3)+1,
          start: monthStart, end: monthEnd, weeks,
          daysInMonth: monthEnd.getUTCDate(),
          name: MONTH_FULL[mm-1], abbr: MONTH_ABBR[mm-1]
        });
      }
      const quartersMeta = [1,2,3,4].map(q => {
        const ms = monthsMeta.filter(mm2 => mm2.quarter === q);
        return { quarter:q, start: ms[0].start, end: ms[ms.length-1].end, months: ms };
      });
      yearMeta[y] = {
        yearKey: y, start: new Date(Date.UTC(y,0,1)), end: new Date(Date.UTC(y,11,31)),
        totalWeeks: totalWeeksContinuous, totalDays: isLeap ? 366 : 365, isLeap,
        months: monthsMeta, quarters: quartersMeta
      };
    }

    const groups = buildGroups(allWeeks);
    const currentIndex = findIdxForDate({ allWeeks }, todayUTC);
    return Object.assign({ YEAR_MIN, YEAR_MAX, allWeeks, yearMeta, currentIndex }, groups);
  }

  const DS = { fiscal: buildFiscalDataset(), calendar: buildCalendarDataset() };

  // ---------- state ----------
  let mode = 'fiscal';
  let view = 'year';
  const pointer = { fiscal: DS.fiscal.currentIndex, calendar: DS.calendar.currentIndex };

  function ds(){ return DS[mode]; }
  function curW(){ return ds().allWeeks[pointer[mode]]; }
  function isCurrentWeek(ww){
    const cw = ds().allWeeks[ds().currentIndex];
    return ww.start.getTime() === cw.start.getTime();
  }

  // ---------- nav ----------
  function navYear(dir){
    const d = ds(), w = curW();
    const pos = d.yearGroups.findIndex(g => g.yearKey === w.yearKey);
    const np = Math.min(Math.max(pos+dir,0), d.yearGroups.length-1);
    pointer[mode] = d.yearGroups[np].startIdx;
  }
  function navQuarter(dir){
    const d = ds(), w = curW();
    const pos = d.quarterGroups.findIndex(g => g.yearKey===w.yearKey && g.quarter===w.quarter);
    const np = Math.min(Math.max(pos+dir,0), d.quarterGroups.length-1);
    pointer[mode] = d.quarterGroups[np].startIdx;
  }
  function navMonth(dir){
    const d = ds(), w = curW();
    const pos = d.monthGroups.findIndex(g => g.yearKey===w.yearKey && g.month===w.month);
    const np = Math.min(Math.max(pos+dir,0), d.monthGroups.length-1);
    pointer[mode] = d.monthGroups[np].startIdx;
  }
  function navWeek(dir){
    const d = ds();
    pointer[mode] = Math.min(Math.max(pointer[mode]+dir,0), d.allWeeks.length-1);
  }

  // ---------- DOM refs ----------
  const contentEl = document.getElementById('content');
  const periodLabel = document.getElementById('periodLabel');
  const periodSub = document.getElementById('periodSub');
  const yearSelect = document.getElementById('yearSelect');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const subtitleText = document.getElementById('subtitleText');

  const SUBTITLES = {
    fiscal: 'FY2000 &ndash; FY2042 &middot; weeks run Sunday&ndash;Saturday &middot; 5&ndash;4&ndash;4-style quarters',
    calendar: '2000 &ndash; 2042 &middot; standard Gregorian calendar &middot; weeks run Sunday&ndash;Saturday'
  };

  function populateYearSelect(){
    yearSelect.innerHTML = '';
    const d = ds();
    for (let y = d.YEAR_MIN; y <= d.YEAR_MAX; y++){
      const opt = document.createElement('option');
      opt.value = y;
      if (mode === 'fiscal') opt.textContent = 'FY' + y + (d.yearMeta[y].isLeap ? ' (53wk)' : '');
      else opt.textContent = y + (d.yearMeta[y].isLeap ? ' (leap)' : '');
      yearSelect.appendChild(opt);
    }
  }

  function dayCellHTML(date, faded){
    const isToday = date.getTime() === todayUTC.getTime();
    const holiday = holidayInfo(date);
    const tooltip = isToday ? ('Today' + (holiday ? ' — ' + holiday.name : '')) : (holiday ? holiday.name : '');
    const isFirstOfCalMonth = date.getUTCDate() === 1;
    const tag = isFirstOfCalMonth ? '<span class="monthtag">' + MONTH_ABBR[date.getUTCMonth()] + '</span>' : '';
    return '<td class="daycell' + (isToday ? ' today' : '') + (holiday ? ' '+holiday.type : '') + (faded ? ' outside' : '') + '"' + (tooltip ? ' title="'+tooltip+'" aria-label="'+tooltip+'"' : '') + '>' + tag + '<span class="num">' + date.getUTCDate() + '</span></td>';
  }

  function monthGridHTML(monthMeta, mini, fadeMonthNum){
    const dowFull = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const dowMini = ['S','M','T','W','T','F','S'];
    let html = '<table class="calgrid' + (mini ? ' mini' : '') + '"><thead><tr>' +
      (mini ? dowMini : dowFull).map(dd => '<th>' + dd + '</th>').join('') +
      '</tr></thead><tbody>';
    monthMeta.weeks.forEach(ww => {
      const cur = isCurrentWeek(ww);
      html += '<tr class="calrow' + (ww.isExtraWeek ? ' extra-row' : '') + (cur ? ' current-row' : '') + '" data-start="' + ww.start.toISOString() + '">';
      for (let i=0;i<7;i++){
        const dte = addDaysUTC(ww.start, i);
        const faded = fadeMonthNum ? (dte.getUTCMonth()+1 !== fadeMonthNum) : false;
        html += dayCellHTML(dte, faded);
      }
      html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  function attachCalRowClicks(){
    contentEl.querySelectorAll('tr.calrow[data-start]').forEach(el => {
      el.addEventListener('click', () => {
        const dt = new Date(el.getAttribute('data-start'));
        pointer[mode] = findIdxForDate(ds(), dt);
        view = 'week';
        setActiveButtons();
        render();
      });
    });
  }

  function renderYear(w){
    const d = ds(), meta = d.yearMeta[w.yearKey];
    const isCurY = w.yearKey === ds().allWeeks[d.currentIndex].yearKey;
    const label = mode === 'fiscal' ? ('Fiscal Year ' + w.yearKey) : String(w.yearKey);
    const leapText = mode === 'fiscal' ? '53-week year' : 'Leap year (366 days)';
    periodLabel.innerHTML = label + (meta.isLeap ? '<span class="badge leap">' + leapText + '</span>' : '') + (isCurY ? '<span class="badge today">Current</span>' : '');
    periodSub.textContent = fmt(meta.start) + ' \u2013 ' + fmt(meta.end);

    const summaryText = mode === 'fiscal'
      ? '<b>' + meta.totalWeeks + ' weeks</b> total &middot; start <b>' + fmt(meta.start) + '</b> &middot; end <b>' + fmt(meta.end) + '</b>'
      : '<b>' + meta.totalDays + ' days</b> total &middot; start <b>' + fmt(meta.start) + '</b> &middot; end <b>' + fmt(meta.end) + '</b>';

    let html = '<div class="card year-summary"><span>' + summaryText + '</span>' +
      '<div class="holiday-legend" aria-label="Calendar highlight legend"><span><i class="holiday-key"></i>Holiday / Shutdown</span></div>' +
      '</div><div class="qgrid">';
    meta.quarters.forEach(q => {
      const isCurQ = isCurY && q.quarter === ds().allWeeks[d.currentIndex].quarter;
      const qname = mode === 'fiscal'
        ? 'Q' + q.quarter + ' &middot; ' + q.weekCount + ' wks'
        : 'Q' + q.quarter + ' (' + q.months[0].abbr + '\u2013' + q.months[2].abbr + ')';
      html += '<div class="card qcard' + (isCurQ ? ' current' : '') + '">' +
        '<div class="qcard-head"><span class="qname">' + qname + '</span>' +
        '<span class="qrange">' + fmtShort(q.start) + ' \u2013 ' + fmtShort(q.end) + '</span></div>';
      q.months.forEach(m => {
        const isCurM = isCurQ && m.month === ds().allWeeks[d.currentIndex].month;
        html += '<div class="minigrid-wrap">' +
          '<div class="minigrid-head"><span class="' + (isCurM?'cur':'') + '">' + m.name + '</span><span>' + fmtShort(m.start) + '\u2013' + fmtShort(m.end) + '</span></div>' +
          monthGridHTML(m, true, mode === 'calendar' ? m.month : null) +
          '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
    contentEl.innerHTML = html;
    attachCalRowClicks();
  }

  function renderQuarter(w){
    const d = ds(), meta = d.yearMeta[w.yearKey];
    const q = meta.quarters[w.quarter-1];
    const isCurQ = w.yearKey === ds().allWeeks[d.currentIndex].yearKey && w.quarter === ds().allWeeks[d.currentIndex].quarter;
    const label = (mode === 'fiscal' ? 'FY' + w.yearKey : w.yearKey) + ' &middot; Q' + w.quarter;
    periodLabel.innerHTML = label + (isCurQ ? '<span class="badge today">Current</span>' : '');
    periodSub.textContent = fmt(q.start) + ' \u2013 ' + fmt(q.end) + (mode === 'fiscal' ? ' (' + q.weekCount + ' weeks)' : ' (' + q.months[0].abbr + '\u2013' + q.months[2].abbr + ')');

    let html = '';
    q.months.forEach(m => {
      const mtitle = mode === 'fiscal' ? 'Month ' + m.month : m.name;
      const msub = mode === 'fiscal' ? '(month ' + m.monthOfQuarter + ' of quarter, ' + m.weekCount + ' wks)' : '(' + m.daysInMonth + ' days)';
      html += '<div class="card monthcard"><div class="monthcard-head">' +
        '<span class="mtitle">' + mtitle + ' <span class="msub">' + msub + '</span></span>' +
        '<span class="mrange">' + fmt(m.start) + ' \u2013 ' + fmt(m.end) + '</span></div>' +
        monthGridHTML(m, false, mode === 'calendar' ? m.month : null) +
        '</div>';
    });
    contentEl.innerHTML = html;
    attachCalRowClicks();
  }

  function renderMonth(w){
    const d = ds(), meta = d.yearMeta[w.yearKey];
    const m = meta.months[w.month-1];
    const isCurM = w.yearKey === ds().allWeeks[d.currentIndex].yearKey && w.month === ds().allWeeks[d.currentIndex].month;
    const label = (mode === 'fiscal' ? 'FY' + w.yearKey + ' &middot; Q' + w.quarter + ' &middot; Month ' + w.month : m.name + ' ' + w.yearKey);
    periodLabel.innerHTML = label + (isCurM ? '<span class="badge today">Current</span>' : '');
    periodSub.textContent = mode === 'fiscal'
      ? fmt(m.start) + ' \u2013 ' + fmt(m.end) + ' (' + m.weekCount + ' weeks, month ' + m.monthOfQuarter + ' of quarter)'
      : fmt(m.start) + ' \u2013 ' + fmt(m.end) + ' &middot; Q' + m.quarter + ' &middot; ' + m.daysInMonth + ' days';

    let html = '<div class="card monthcard">' + monthGridHTML(m, false, mode === 'calendar' ? m.month : null);

    if (mode === 'fiscal'){
      html += '<table class="weektable"><thead><tr>' +
        '<th>Week (FY)</th><th>Week (month)</th><th>Week (quarter)</th><th>Range</th></tr></thead><tbody>';
      m.weeks.forEach(ww => {
        const cur = isCurrentWeek(ww);
        html += '<tr class="' + (cur?'current':'') + '" data-start="' + ww.start.toISOString() + '">' +
          '<td>Wk ' + ww.weekOfYear + ' of ' + ww.weekOfYearTotal + '</td>' +
          '<td>Wk ' + ww.weekOfMonth + ' of ' + ww.weekOfMonthTotal + (ww.isExtraWeek?' (extra)':'') + '</td>' +
          '<td>Wk ' + ww.weekOfQuarter + ' of ' + ww.weekOfQuarterTotal + '</td>' +
          '<td class="range">' + fmt(ww.start) + ' \u2013 ' + fmt(ww.end) + '</td>' +
          '</tr>';
      });
      html += '</tbody></table>';
    } else {
      html += '<div class="infoline">' + m.name + ' ' + w.yearKey + ' has <b>' + m.daysInMonth + ' days</b>, starting on a <b>' + dayName(m.start) + '</b>.</div>';
    }
    html += '</div>';
    contentEl.innerHTML = html;

    attachCalRowClicks();
    contentEl.querySelectorAll('tr[data-start]:not(.calrow)').forEach(el => {
      el.addEventListener('click', () => {
        const dt = new Date(el.getAttribute('data-start'));
        pointer[mode] = findIdxForDate(ds(), dt);
        view = 'week';
        setActiveButtons();
        render();
      });
    });
  }

  function renderWeek(w){
    const isCur = isCurrentWeek(w);
    const label = (mode === 'fiscal' ? 'FY' + w.yearKey : w.yearKey) + ' &middot; Week ' + w.weekOfYear + ' of ' + w.weekOfYearTotal;
    periodLabel.innerHTML = label + (isCur ? '<span class="badge today">Current</span>' : '') + (w.isExtraWeek ? '<span class="badge leap">Extra week</span>' : '');
    const monthName = mode === 'fiscal' ? 'Month ' + w.month : MONTH_FULL[w.month-1];
    periodSub.textContent = 'Q' + w.quarter + ' \u00b7 ' + monthName;

    let html = '<div class="card weekcard">' +
      '<div class="range">' + fmt(w.start) + ' \u2013 ' + fmt(w.end) + '</div>' +
      '<div class="breadcrumb">' + (mode==='fiscal'?'FY':'') + w.yearKey + ' &middot; Quarter ' + w.quarter + ' &middot; ' + monthName + ' (week ' + w.weekOfMonth + ' of ' + w.weekOfMonthTotal + ' in month) &middot; week ' + w.weekOfQuarter + ' of ' + w.weekOfQuarterTotal + ' in quarter</div>' +
      '<div class="daystrip">';
    for (let i=0;i<7;i++){
      const dte = addDaysUTC(w.start, i);
      const isToday = dte.getTime() === todayUTC.getTime();
      const holiday = holidayInfo(dte);
      const tooltip = isToday ? ('Today' + (holiday ? ' — ' + holiday.name : '')) : (holiday ? holiday.name : '');
      html += '<div class="day' + (isToday?' today':'') + (holiday?' '+holiday.type:'') + '"' + (tooltip?' title="'+tooltip+'" aria-label="'+tooltip+'"':'') + '>' +
        '<div class="dname">' + dayName(dte) + '</div>' +
        '<div class="dnum">' + fmtShort(dte) + '</div>' +
        (holiday?'<div class="holiday-name">'+holiday.name+'</div>':'') + '</div>';
    }
    html += '</div></div>';
    contentEl.innerHTML = html;
  }

  function render(){
    subtitleText.innerHTML = SUBTITLES[mode];

    const w = curW();
    yearSelect.value = w.yearKey;
    if (view === 'year') renderYear(w);
    else if (view === 'quarter') renderQuarter(w);
    else if (view === 'month') renderMonth(w);
    else renderWeek(w);

    const d = ds(), w2 = curW();
    if (view==='year'){
      prevBtn.disabled = w2.yearKey === d.YEAR_MIN;
      nextBtn.disabled = w2.yearKey === d.YEAR_MAX;
    } else if (view==='quarter'){
      const pos = d.quarterGroups.findIndex(g=>g.yearKey===w2.yearKey&&g.quarter===w2.quarter);
      prevBtn.disabled = pos===0; nextBtn.disabled = pos===d.quarterGroups.length-1;
    } else if (view==='month'){
      const pos = d.monthGroups.findIndex(g=>g.yearKey===w2.yearKey&&g.month===w2.month);
      prevBtn.disabled = pos===0; nextBtn.disabled = pos===d.monthGroups.length-1;
    } else {
      prevBtn.disabled = pointer[mode]===0; nextBtn.disabled = pointer[mode]===d.allWeeks.length-1;
    }
  }

  function setActiveButtons(){
    document.querySelectorAll('#tabs button').forEach(t => t.classList.toggle('active', t.getAttribute('data-view')===view));
    document.querySelectorAll('#modeSwitch button').forEach(t => t.classList.toggle('active', t.getAttribute('data-mode')===mode));
  }

  document.querySelectorAll('#tabs button').forEach(t => {
    t.addEventListener('click', () => { view = t.getAttribute('data-view'); setActiveButtons(); render(); });
  });
  document.querySelectorAll('#modeSwitch button').forEach(t => {
    t.addEventListener('click', () => {
      mode = t.getAttribute('data-mode');
      populateYearSelect();
      setActiveButtons();
      render();
    });
  });

  prevBtn.addEventListener('click', () => {
    if (view==='year') navYear(-1);
    else if (view==='quarter') navQuarter(-1);
    else if (view==='month') navMonth(-1);
    else navWeek(-1);
    render();
  });
  nextBtn.addEventListener('click', () => {
    if (view==='year') navYear(1);
    else if (view==='quarter') navQuarter(1);
    else if (view==='month') navMonth(1);
    else navWeek(1);
    render();
  });

  yearSelect.addEventListener('change', () => {
    const y = parseInt(yearSelect.value, 10);
    const g = ds().yearGroups.find(g => g.yearKey === y);
    pointer[mode] = g.startIdx;
    render();
  });

  document.getElementById('todayBtn').addEventListener('click', () => {
    pointer[mode] = ds().currentIndex;
    render();
  });

  populateYearSelect();
  setActiveButtons();
  render();
})();
</script>
</body>
</html>
